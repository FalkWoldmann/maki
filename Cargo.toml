[profile.bench]
debug = true

# Dev rebuilds are linker bound, and debug info is most of what the linker
# chews through. Our crates keep theirs so a debugger still works, the 600
# dependencies do not need any.
[profile.dev.package."*"]
debug = false

# `cc` reads DEBUG from here and passes -g when it is on, which covers the C
# and C++ we build from source: aws-lc, curl, Luau and 30 tree-sitter
# grammars. Those static archives held the bulk of the bytes.
[profile.dev.build-override]
debug = false

# crossterm 0.29.0 has no VT input on Windows, so bracketed paste never decodes and a
# multiline paste submits at the first newline (#336). Pinned to the head of
# crossterm-rs/crossterm#1030, which lives in refs/pull/1030/head on the upstream repo.
# Remove once the PR ships in a crossterm release.
#
# syntect 5.3.0 spins forever on a JavaScript line like `x /*`: two rules match
# empty at the same byte and `set` each other back, which is neither the push nor
# the pop its loop guard watches, so one such line pins a core at 100% for good.
# Pinned to a v5.3.0 backport of trishume/syntect#706, remove once that ships.
[patch.crates-io]
crossterm = { git = "https://github.com/crossterm-rs/crossterm", rev = "94ed7154e35d24a2f643c61760e1eb05b8ca9e63" }
syntect = { git = "https://github.com/tontinton/syntect", rev = "01df275f6f25da670e5ba5b7128cb89d03795119" }
