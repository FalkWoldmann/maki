[package]
name = "maki"
version.workspace = true
edition = "2024"
authors = ["Tony Solomonik <tony.solomonik@gmail.com>"]
description = "AI coding agent. Native Rust TUI. Immediate startup, 60 FPS, low memory."
license = "MIT"
repository = "https://github.com/tontinton/maki"
homepage = "https://maki.sh"
readme = "README.md"
keywords = ["ai", "agent", "cli", "tui", "coding"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.99"

[[bin]]
name = "maki"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
maki-ui = { workspace = true }
maki-agent = { workspace = true }
maki-acp = { workspace = true }
maki-config = { workspace = true }
maki-providers = { workspace = true }
maki-storage = { workspace = true }
maki-lua = { workspace = true }
maki-otel = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
smol = { workspace = true }
tempfile = { workspace = true }
isahc = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
flume = { workspace = true }
open = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
maki-config = { workspace = true, features = ["test-util"] }
test-case = { workspace = true }

[workspace]
members = [
  "maki-acp",
  "maki-agent",
  "maki-config",
  "maki-docgen",
  "maki-highlight",
  "maki-interpreter",
  "maki-lua",
  "maki-markdown",
  "maki-otel",
  "maki-pack",
  "maki-providers",
  "maki-storage",
  "maki-config-macro",
  "maki-lua-macro",
  "maki-ui",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Tony Solomonik <tony.solomonik@gmail.com>"]
license = "MIT"
repository = "https://github.com/tontinton/maki"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"

# Groups (priority -1 lets single lints override them without tripping clippy::lint_groups_priority)

deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

# Single

# `-1i32.abs()` is -1
ambiguous_negative_literals = "deny"
# keep typo detection for cfgs while allowing --cfg tokio_unstable (tokio-console, runtime metrics)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
# warn, not deny: a stale #[expect] (e.g. dead_code that only holds outside cfg(test)) would break cargo build/test
unfulfilled_lint_expectations = "warn"
unused_must_use = "deny"
unused_qualifications = "warn"

async_fn_in_trait = "allow"

# Not here: dead_code_pub_in_binary. In a shared table it also fires on every lib.rs, because
# `--all-targets` builds the lib as a test binary. Put `#![warn(dead_code_pub_in_binary)]` at
# the top of each main.rs instead, until https://github.com/rust-lang/rust/issues/159078 is fixed.

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
checked_conversions = "deny"
clone_on_ref_ptr = "deny"
collection_is_never_read = "deny"
duration_suboptimal_units = "deny"
empty_drop = "deny"
enum_glob_use = "deny"
expect_used = "deny"
explicit_into_iter_loop = "deny"
fallible_impl_from = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
fn_params_excessive_bools = "deny"
if_then_some_else_none = "deny"
implicit_clone = "deny"
indexing_slicing = "deny"
iter_filter_is_ok = "deny"
iter_filter_is_some = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
linkedlist = "deny"
match_same_arms = "deny"
match_wild_err_arm = "deny"
match_wildcard_for_single_variants = "deny"
mut_mut = "deny"
mutex_integer = "deny"
needless_collect = "deny"
needless_continue = "deny"
needless_for_each = "deny"
needless_pass_by_value = "deny"
option_as_ref_cloned = "deny"
option_option = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
redundant_else = "deny"
ref_option = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_functions_in_if_condition = "deny"
semicolon_if_nothing_returned = "deny"
single_match_else = "deny"
str_to_string = "deny"
string_lit_as_bytes = "deny"
suspicious_operation_groupings = "deny"
todo = "deny"
trait_duplication_in_bounds = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_box_returns = "deny"
unnecessary_self_imports = "deny"
unnecessary_trailing_comma = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"
unused_async = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
zero_sized_map_values = "deny"

# Panics in request paths (clippy.toml exempts tests)

panic = "deny"
read_zero_byte_vec = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"

# Process and resource lifetime

exit = "deny"
mem_forget = "deny"

# Output belongs in tracing

dbg_macro = "deny"
missing_fields_in_debug = "deny"
print_stderr = "deny"

# Tests

ignore_without_reason = "deny"
should_panic_without_expect = "deny"

# Casts

as_underscore = "deny"
cast_lossless = "deny"

# Idioms (all autofixable)

cloned_instead_of_copied = "deny"
debug_assert_with_mut_call = "deny"
explicit_iter_loop = "deny"
manual_instant_elapsed = "deny"
manual_let_else = "deny"
non_std_lazy_statics = "deny"
or_fun_call = "deny"

large_futures = "warn"

# warn: real bugs, but they need judgement at some sites

assertions_on_result_states = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
float_cmp = "warn"
ignored_unit_patterns = "warn"
literal_string_with_formatting_args = "warn"
# string_slice: indexing_slicing doesn't cover `&s[..n]`, which panics inside a multi-byte char
string_slice = "warn"
unnecessary_join = "warn"
unreachable = "warn"

# warn: async diagnostics (nursery)

# fires on `&impl Trait` params of async fns unless the trait has `Send + Sync` supertraits
future_not_send = "warn"
needless_pass_by_ref_mut = "warn"
significant_drop_in_scrutinee = "warn"

[workspace.dependencies]
maki-agent = { path = "maki-agent" }
maki-acp = { path = "maki-acp" }
maki-config = { path = "maki-config" }
maki-interpreter = { path = "maki-interpreter" }
maki-providers = { path = "maki-providers" }
maki-storage = { path = "maki-storage" }
maki-ui = { path = "maki-ui" }
maki-lua = { path = "maki-lua" }
maki-config-macro = { path = "maki-config-macro" }
maki-lua-macro = { path = "maki-lua-macro" }
maki-highlight = { path = "maki-highlight" }
maki-markdown = { path = "maki-markdown" }
maki-otel = { path = "maki-otel" }
maki-pack = { path = "maki-pack" }
