# Startup defaults for Amazon Bedrock. Every other model, its limits and its
# rates come from models.dev's `amazon-bedrock` entry. `global.` profiles run
# from any commercial region and cost what Anthropic charges, where the
# geography profiles (`eu.`, `us.`, ...) cost 10% more.
slug = "bedrock"

[[model]]
prefixes = ["global.anthropic.claude-haiku-5-5"]
tier = "weak"
family = "claude"
vision = true
default = true
max_output_tokens = 128000
context_window = 1000000
deferred_tools = true
pricing = { input = 0.1, output = 0.5, cache_write = 0.125, cache_read = 0.01 }

[[model]]
prefixes = ["global.anthropic.claude-sonnet-5-5"]
tier = "medium"
family = "claude"
vision = true
default = true
max_output_tokens = 128000
context_window = 1000000
deferred_tools = true
pricing = { input = 2.0, output = 10.0, cache_write = 2.5, cache_read = 0.1 }

[[model]]
prefixes = ["global.anthropic.claude-opus-5-5"]
tier = "strong"
family = "claude"
vision = true
default = true
max_output_tokens = 128000
context_window = 1000000
deferred_tools = true
pricing = { input = 4.0, output = 20.0, cache_write = 5.0, cache_read = 0.2 }
